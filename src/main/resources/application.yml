spring:
  application:
    name: webhook-relay
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: validate
app:
  retry:
    base-delay: 1s
    max-delay: 30s
    max-attempts: 5

  mock-receiver:
    secret: ${MOCK_RECEIVER_SECRET:local-test-secret}
